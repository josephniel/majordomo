# Vendor tool-calling eval cases (./manage eval). Each case runs against
# real vendor APIs with fake recording connectors — no side effects.
# Fields: name, prompt, expect_tool (substring of a called tool name),
#         expect_no_tool, reply_matches (regex over the reply).

- name: one_shot_reminder
  prompt: "Remind me in 20 minutes to stand up and stretch."
  expect_tool: schedule_once

- name: recurring_schedule
  prompt: "Every weekday at 8am, remind me to check the deploy queue."
  expect_tool: schedule_create

- name: memory_save_fact
  prompt: "Remember that my sister's birthday is March 14."
  expect_tool: memory_save

- name: memory_save_preference
  prompt: "For future reference: I hate morning meetings, never suggest anything before 10am."
  expect_tool: memory_save

- name: recall_before_denying
  prompt: "What did I tell you about my sister?"
  expect_tool: memory_recall

- name: smalltalk_no_tools
  prompt: "Good morning! How's it going?"
  expect_no_tool: true

- name: taglish_reminder
  prompt: "Paalala mo ako bukas ng 9am na tawagan si mama."
  expect_tool: schedule_once

# Regression, 2026-07-26. A local model narrated "Searching your Gmail now..."
# and never called the tool, on 4 of 5 live turns — while scoring 7/7 here,
# because every case above is single-prompt. The failure needs the user to
# have ALREADY answered the clarifying question: a weak model re-asks it
# instead of acting. `history` exists for exactly this.
- name: acts_after_clarification_answered
  history:
    - role: user
      content: "Can you read and summarize my emails from last week"
    - role: assistant
      content: "I can certainly check! Do you want your work mailbox or your personal one?"
  prompt: "Both, go ahead"
  expect_tool: search_emails

# Same trap, one step shorter: a bare confirmation must be acted on, not
# bounced back as another question.
- name: acts_on_bare_confirmation
  history:
    - role: user
      content: "Do I have anything on my calendar I should know about?"
    - role: assistant
      content: "Would you like me to check your calendar for this week?"
  prompt: "Yes"
  expect_tool: calendar
