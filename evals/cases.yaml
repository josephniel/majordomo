# Vendor tool-calling eval cases (./manage eval). Each case runs against
# real vendor APIs with fake recording connectors — no side effects.
# Fields: name, prompt, expect_tool (substring of a called tool name),
#         expect_no_tool, reply_matches (regex over the reply).

- name: one_shot_reminder
  prompt: "Remind me in 20 minutes to stand up and stretch."
  expect_tool: schedule_once

- name: recurring_schedule
  prompt: "Every weekday at 8am, remind me to check the deploy queue."
  expect_tool: schedule_create

- name: memory_save_fact
  prompt: "Remember that my sister's birthday is March 14."
  expect_tool: memory_save

- name: memory_save_preference
  prompt: "For future reference: I hate morning meetings, never suggest anything before 10am."
  expect_tool: memory_save

- name: recall_before_denying
  prompt: "What did I tell you about my sister?"
  expect_tool: memory_recall

- name: smalltalk_no_tools
  prompt: "Good morning! How's it going?"
  expect_no_tool: true

- name: taglish_reminder
  prompt: "Paalala mo ako bukas ng 9am na tawagan si mama."
  expect_tool: schedule_once

# Regression, 2026-07-26. A local model narrated "Searching your Gmail now..."
# and never called the tool, on 4 of 5 live turns — while scoring 7/7 here,
# because every case above is single-prompt. The failure needs the user to
# have ALREADY answered the clarifying question: a weak model re-asks it
# instead of acting. `history` exists for exactly this.
- name: acts_after_clarification_answered
  history:
    - role: user
      content: "Can you read and summarize my emails from last week"
    - role: assistant
      content: "I can certainly check! Do you want your work mailbox or your personal one?"
  prompt: "Both, go ahead"
  expect_tool: search_emails

# Same trap, one step shorter: a bare confirmation must be acted on, not
# bounced back as another question.
- name: acts_on_bare_confirmation
  history:
    - role: user
      content: "Do I have anything on my calendar I should know about?"
    - role: assistant
      content: "Would you like me to check your calendar for this week?"
  prompt: "Yes"
  expect_tool: calendar

# Regression, 2026-09-01. In a control room shared with a peer bot, the dev
# assistant answered five consecutive messages about a credit-card statement
# — each one to say the topic belonged to the other bot. Five turns on the
# chat model to produce five apologies, in a room where the bot that COULD
# answer was already answering.
#
# The room prompt had always said to emit <silent>. What it did not say was
# that this rule outranks a persona's own instruction to explain plainly what
# it cannot do — so the model obeyed the more specific-sounding one. These
# cases pin the precedence, against the prompt section that actually ships.
- name: control_room_declines_a_peers_topic
  system_suffix_prompt: telegram_control_room
  prompt: "[@operator]: Hi, I just paid my wave credit card using my payroll account"
  expect_no_tool: true
  reply_matches: '^\s*<silent>'

# The other half of the rule, and the one that makes silence safe to enforce:
# being named must always break it. Asserted as "did not go silent" rather
# than as a specific tool call — a weaker model may reasonably ask which day
# first, and that is still the behaviour under test. What must never happen
# is <silent> in reply to its own name.
- name: control_room_answers_when_at_mentioned
  system_suffix_prompt: telegram_control_room
  prompt: "[@operator]: @eval_bot remind me at 4pm to file the expense report"
  reply_matches: '\A(?!\s*<silent>)'

# The follow-up messages are the ones that actually hurt: each looks like a
# fresh ask, and a bot that reasons per-message re-announces its absence
# every time. The peer bot's answer is in history, so there is nothing left
# for this one to add.
- name: control_room_stays_quiet_on_a_follow_up
  system_suffix_prompt: telegram_control_room
  history:
    - role: user
      content: "[@operator]: I just paid my wave credit card"
    - role: assistant
      content: "<silent>"
  prompt: "[@operator]: No, the 22k is the min amount I paid. Just approve the pending ones from the list"
  expect_no_tool: true
  reply_matches: '^\s*<silent>'
