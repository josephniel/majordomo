# Only Postgres is dockerized. The bot itself runs on the HOST (via ./manage
# bot / up), so it keeps this machine's LLM connections — notably the Claude
# Code subscription auth a container can't see — plus the .env API keys.
#
# Postgres is published on host port 5433 (NOT 5432) to avoid colliding with
# any Postgres already on the host. Data lives in the external named volume
# `majordomo_pgdata` (created by `./manage db-up` if missing), so
# `docker compose down` never destroys it.
#
# The project name is PINNED below. Compose otherwise derives it from the
# directory name, so checking the repo out under any other folder name makes
# compose treat the running Postgres as a stranger and fail with a
# container-name conflict. Postgres is shared infrastructure — one database,
# one container, many bot instances — so its identity must not depend on
# where any particular clone happens to live.

name: majordomo

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: majordomo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: majordomo
      POSTGRES_USER: majordomo
      POSTGRES_PASSWORD: majordomo_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - majordomo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majordomo -d majordomo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  majordomo_pgdata:
    external: true
